# Redis — fila, cache e sessões da Clínica Sorriso e Vida

# Persistência: AOF ligado — a fila de mensagens do WhatsApp não pode
# se perder num restart do container
appendonly yes
appendfsync everysec

# Sem snapshots RDB (o AOF já cobre)
save ""

# NUNCA evictar chaves: jobs de fila não podem ser descartados por memória.
# Se a memória estourar, escrever falha (visível) em vez de perder job (silencioso).
maxmemory-policy noeviction

# Segurança básica: só a rede interna do compose alcança o Redis,
# mas desabilita comandos perigosos por precaução
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command CONFIG ""
