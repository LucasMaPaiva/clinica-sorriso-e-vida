; Configuração comum (dev e prod)
memory_limit = 512M
upload_max_filesize = 20M
post_max_size = 21M
max_execution_time = 60
date.timezone = UTC
expose_php = Off

; Opcache (validate_timestamps fica ligado em dev; prod sobrescreve)
opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
