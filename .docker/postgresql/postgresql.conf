# PostgreSQL 17 — configuração de DESENVOLVIMENTO LOCAL
# (em produção o app conecta no banco do servidor; este arquivo não é usado lá)

listen_addresses = '*'
max_connections = 50

# Memória modesta — é um banco de dev
shared_buffers = 128MB
work_mem = 8MB
maintenance_work_mem = 64MB

# Logs úteis em dev
log_statement = 'none'
log_min_duration_statement = 500   # loga queries acima de 500ms

timezone = 'UTC'
